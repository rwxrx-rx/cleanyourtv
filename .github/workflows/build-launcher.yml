name: Build launcher APK

# Builds the launcher in GitHub's cloud so it can be installed from a phone (Termux), where gradle and
# the Android SDK do not run. Start it from the Actions tab: "Build launcher APK" > "Run workflow".
# Then download the artifact "cleanyourtv-launcher-apk" and install it with launcher/install-apk.sh
# (docs/TERMUX.md).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the release APK
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease --console=plain
      - name: APK size
        run: |
          f=launcher/app/build/outputs/apk/release/app-release.apk
          echo "release APK: $(( $(stat -c %s "$f") / 1024 )) KB"
      - uses: actions/upload-artifact@v4
        with:
          name: cleanyourtv-launcher-apk
          path: launcher/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
